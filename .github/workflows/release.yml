name: Build installers

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux:
    name: Debian installer
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p package-input/lib dist
          mvn --batch-mode package dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory=package-input/lib
          cp target/Films-List-1.0-SNAPSHOT.jar package-input/
          jpackage \
            --type deb \
            --name Films-List \
            --app-version "$version" \
            --input package-input \
            --main-jar Films-List-1.0-SNAPSHOT.jar \
            --main-class me.fotis.App \
            --class-path 'lib/*' \
            --dest dist \
            --vendor 'Fotis Kosmidis' \
            --description 'A personal desktop film tracker' \
            --linux-shortcut

      - name: Upload Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: debian-installer
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path package-input/lib, dist | Out-Null
          mvn --batch-mode package dependency:copy-dependencies `
            -DincludeScope=runtime `
            -DoutputDirectory=package-input/lib
          Copy-Item target/Films-List-1.0-SNAPSHOT.jar package-input/
          jpackage `
            --type exe `
            --name Films-List `
            --app-version $version `
            --input package-input `
            --main-jar Films-List-1.0-SNAPSHOT.jar `
            --main-class me.fotis.App `
            --class-path 'lib/*' `
            --dest dist `
            --vendor 'Fotis Kosmidis' `
            --description 'A personal desktop film tracker' `
            --win-menu `
            --win-shortcut

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Films List ${GITHUB_REF_NAME}" \
            --generate-notes
